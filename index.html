<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room 2D - Le Bureau Secret</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header">
        <h1>Escape Room : Le Bureau Secret</h1>
        <div id="timer">Temps : 03:00</div>
    </div>

    <div id="game-container">
        <div class="wall"></div>
        <div class="floor"></div>

        <!-- Objets interactifs -->
        <div id="door" class="item">PORTE</div>
        <div id="safe" class="item">COFFRE<br>[ 🔒 ]</div>
        <div id="painting" class="item">Tableau<br>Ancien</div>
        <div id="bookshelf" class="item">Bibliothèque</div>
        <div id="plant" class="item">🪴</div>
        <div id="desk" class="item">Bureau</div>

        <!-- Personnage contrôlable -->
        <div id="player">🕵️</div>

        <!-- Fenêtre du code secret -->
        <div id="modal">
            <div id="modal-content">
                <h3>Entrez le code à 4 chiffres</h3>
                <input type="text" id="safe-code" maxlength="4" placeholder="0000"><br>
                <button id="btn-validate">Valider</button>
                <button id="btn-close">Fermer</button>
            </div>
        </div>
    </div>

    <div id="ui-bar">
        <div id="message-box">Déplacez-vous avec les flèches du clavier et appuyez sur <strong>Espace</strong> (ou cliquez) près d'un objet !</div>
        <div id="inventory">
            <div id="inventory-title">Inventaire (Cliquez pour équiper)</div>
            <div id="inventory-items"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
